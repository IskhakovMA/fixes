name: I-9 Quality native zoom exact PR HEAD
on:
  push:
    branches: [verification/i9-quality-native-zoom-pr]
permissions:
  contents: read
jobs:
  linux-native-zoom:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: 387318db8f466f0221bc146acb23461d443efbd2
          fetch-depth: 2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install locked dependencies and full Chromium
        run: |
          python -m pip install --disable-pip-version-check -r backend/requirements-dev.txt
          python -m pip check
          npm ci --ignore-scripts --prefix tools/tests/wp_h
          tools/tests/wp_h/node_modules/.bin/playwright install --with-deps chromium
      - name: Test exact PR HEAD using the original synthetic lab
        env:
          CANDIDATE: 387318db8f466f0221bc146acb23461d443efbd2
          DEBUG: pw:browser
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE"
          export PLAYWRIGHT_MODULE="$PWD/tools/tests/wp_h/node_modules/playwright"
          export AXE_SOURCE="$PWD/tools/tests/wp_h/node_modules/axe-core/axe.min.js"
          export WP_H_FULL_CHROMIUM="$(node -p 'require(process.env.PLAYWRIGHT_MODULE).chromium.executablePath()')"
          test -x "$WP_H_FULL_CHROMIUM"
          evidence="$RUNNER_TEMP/i9-public-evidence"
          raw="$(mktemp -d "$RUNNER_TEMP/i9-zoom-raw.XXXXXX")"
          mkdir -m 700 "$evidence"
          {
            printf 'pr_head=%s\nworkflow_sha=%s\n' "$(git rev-parse HEAD)" "$GITHUB_SHA"
            uname -sm
            python -V
            node -v
            npm ls playwright axe-core --prefix tools/tests/wp_h
            "$WP_H_FULL_CHROMIUM" --version
          } > "$evidence/environment.txt"
          cat "$evidence/environment.txt"
          run_case() {
            local label="$1" output="$2" code=0
            python tools/tests/wp_i_quality/run_browser.py --suite browser_zoom --count 240 --out "$output" > "$raw/$label.runner.log" 2>&1 || code=$?
            printf '%s exit=%s\n' "$label" "$code" | tee -a "$evidence/status.txt"
            python - "$label" "$raw" "$output" "$evidence" <<'PY' || return 125
          import re
          import sys
          from pathlib import Path
          label, raw, output, evidence = sys.argv[1:]
          files = {
              "runner.log": Path(raw) / f"{label}.runner.log",
              "chromium.log": Path(output) / "browser.local.log",
              "fastapi.log": Path(output) / "server.local.log",
              "receipt.json": Path(output) / "browser-native-zoom.json",
          }
          for name, source in files.items():
              if not source.is_file():
                  continue
              text = source.read_text(encoding="utf-8", errors="replace")
              text = re.sub(r"(locator\.fill\()[^\n]*", r"\1[REDACTED])", text)
              text = re.sub(r"(?i)\b(authorization|set-cookie|cookie|password|token|secret)(\s*[:=]\s*)[^\n]+", r"\1\2[REDACTED]", text)
              text = re.sub(r"(?<![\w-])[\w-]{43}(?![\w-])", "[REDACTED]", text, flags=re.ASCII)
              text = re.sub(r"(https?://[^\s?'\"<>]+)\?[^\s'\"<>]+", r"\1?[REDACTED]", text)
              (Path(evidence) / f"{label}.{name}").write_text(text, encoding="utf-8")
          PY
            return "$code"
          }
          run_case pr-head "$RUNNER_TEMP/i9-results/quality-browser_zoom"
          test -s "$evidence/pr-head.receipt.json"
      - name: Publish sanitized diagnostic evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: i9-quality-native-zoom-pr-head-evidence
          path: ${{ runner.temp }}/i9-public-evidence/
          if-no-files-found: error
          retention-days: 14
