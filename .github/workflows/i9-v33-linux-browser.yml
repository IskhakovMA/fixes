name: I-9 v33 exact-candidate Linux browser verification

on:
  push:
    branches: [verification/i9-v33-linux-browser]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CANDIDATE_SHA: 3a0cb5db434032b3f7b6370c305c558a4b5d331c

jobs:
  synthetic-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        suite:
          - history-unknownDenial
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Verify workflow-only child and select exact candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          previous=8d0c28fcf49edb27eca13272e38942b378ff1d67
          parent=8149e69504fb372a9e9037f35fe09ae2a0e6bfb6
          original=9ac9a2b2d5b93c76910cefb3c9ec27b4bc85f94c
          initial=9472103cd17ba857ab54c35a5d84d7b01d052c9d
          workflow=.github/workflows/i9-v33-linux-browser.yml
          diag=tools/tests/wp_i_workspace/diagnostic
          history_probe=tools/tests/wp_i_card/diagnostic/trace_unknown_denial.py
          test "$(git rev-list --parents -n1 HEAD)" = "$GITHUB_SHA $previous"
          test "$(git rev-list --parents -n1 "$previous")" = "$previous $parent"
          test "$(git diff --name-status "$previous" HEAD)" = "$(printf 'M\t%s\nA\t%s' "$workflow" "$history_probe")"
          git show "HEAD:$history_probe" > "$RUNNER_TEMP/trace_unknown_denial.py"
          test "$(git rev-list --parents -n1 "$parent")" = "$parent $original"
          test "$(git rev-list --parents -n1 "$original")" = "$original $initial"
          test "$(git rev-list --parents -n1 "$initial")" = "$initial $CANDIDATE_SHA"
          test "$(git diff --name-status "$CANDIDATE_SHA" "$original")" = "$(printf 'A\t%s' "$workflow")"
          expected=$(printf 'M\t%s\nA\t%s/apply_precondition.py\nA\t%s/quiesce.cjs' "$workflow" "$diag" "$diag")
          test "$(git diff --name-status "$parent" "$previous")" = "$expected"
          probe="$RUNNER_TEMP/ws-probe"
          mkdir -m 700 "$probe"
          base_files=(apply_probe.py backend_probe.py publish_receipt.py timeline.cjs)
          final_files=(apply_precondition.py apply_probe.py backend_probe.py publish_receipt.py quiesce.cjs timeline.cjs)
          test "$(git diff --name-status "$original" "$parent")" = "$(printf 'M\t%s\nA\t%s\n' "$workflow" "$diag/${base_files[0]}"; for file in "${base_files[@]:1}"; do printf 'A\t%s/%s\n' "$diag" "$file"; done)"
          test "$(git diff --name-status "$CANDIDATE_SHA" "$previous")" = "$(printf 'A\t%s\n' "$workflow"; for file in "${final_files[@]}"; do printf 'A\t%s/%s\n' "$diag" "$file"; done)"
          for file in "${final_files[@]}"; do
            git show "HEAD:$diag/$file" > "$probe/$file"
          done
          echo "I9_CHAIN=$GITHUB_SHA $previous $parent $original $initial $CANDIDATE_SHA"
          echo "I9_WORKFLOW=$GITHUB_SHA"
          git checkout --detach "$CANDIDATE_SHA"
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.18'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.5'
      - name: Install pinned synthetic test dependencies
        run: |
          python -m pip install --disable-pip-version-check -r backend/requirements-dev.txt
          npm ci --ignore-scripts --prefix tools/tests/wp_h
          tools/tests/wp_h/node_modules/.bin/playwright install --with-deps chromium
      - name: Run synthetic browser suites
        env:
          SUITE: ${{ matrix.suite }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -s)" = Linux
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(python -V)" = "Python 3.13.18"
          test "$(node -v)" = "v22.23.5"
          export NO_PROXY=127.0.0.1,localhost no_proxy=127.0.0.1,localhost
          export PLAYWRIGHT_MODULE="$PWD/tools/tests/wp_h/node_modules/playwright"
          export AXE_SOURCE="$PWD/tools/tests/wp_h/node_modules/axe-core/axe.min.js"
          test "$(node -p 'require(process.env.PLAYWRIGHT_MODULE + "/package.json").version')" = "1.62.1"
          test "$(node -p 'require(require("node:path").dirname(process.env.AXE_SOURCE) + "/package.json").version')" = "4.11.0"
          export WP_H_FULL_CHROMIUM="$(node -p 'require(process.env.PLAYWRIGHT_MODULE).chromium.executablePath()')"
          export BROWSER_EXECUTABLE="$WP_H_FULL_CHROMIUM"
          test -x "$BROWSER_EXECUTABLE"
          echo "I9_ENV=$CANDIDATE_SHA $(uname -sm) $(python -V) node=$(node -v)"
          chromium_version="$("$BROWSER_EXECUTABLE" --version)"
          case "$chromium_version" in
            "Google Chrome for Testing 151.0.7922.34"|"Google Chrome for Testing 151.0.7922.34 ") ;;
            *) echo "Unexpected Chromium version"; exit 2 ;;
          esac
          echo "I9_CHROMIUM=$chromium_version"
          umask 077
          root="$(mktemp -d /tmp/i9cb.XXXXXX)"
          trap 'rm -rf -- "$root"' EXIT
          result=0
          summarize_failure() {
            python - "$root" "$1" <<'PY'
          from itertools import islice
          from pathlib import Path
          import json
          import re
          import sys

          root, case = Path(sys.argv[1]), sys.argv[2]
          folder = root / case
          timeout_targets = {
              'wp_i_card-history': ('wp_i_card', 'history.cjs'),
              'wp_i_consilium-decisions': ('wp_i_consilium', 'decisions.cjs'),
              'wp_i_workspace-workflows': ('wp_i_workspace', 'workflows.cjs'),
          }
          timeout_target = timeout_targets.get(case.removesuffix("-B1").removesuffix("-A"))
          timeout_locations = set()
          timeout_ops = set()
          completed_checks = 'unknown'
          if timeout_target:
              suite_dir, suite_script = timeout_target
              source_dir = Path.cwd() / 'tools/tests' / suite_dir
              files = {name: (source_dir / name).read_text().splitlines()
                       for name in (suite_script, 'fixtures.cjs')}
              file_names = b'|'.join(re.escape(name.encode()) for name in files)
              safe_frame = re.compile(
                  rb'^(?:[ \t]*at\b.*?[ (])(?:file://)?' + re.escape(str(source_dir).encode()) +
                  rb'/(' + file_names + rb'):(\d{1,4}):(\d{1,4})(?:\))?[ \t]*$'
              )
              timeout_op = re.compile(
                  rb'^(?:TimeoutError:[ \t]*)?'
                  rb'(browserType\.launch|page\.(?:goto|reload|waitForFunction|waitForResponse|waitForEvent|'
                  rb'evaluate|screenshot)|locator\.(?:click|fill|focus|selectOption|waitFor|evaluate|elementHandle)|'
                  rb'apiRequestContext\.(?:fetch|get|post|put|patch|delete)|route\.(?:fetch|fulfill|continue|abort))'
                  rb':[ \t]*(?:TimeoutError:[ \t]*)?Timeout \d{1,7}ms exceeded\b'
              )
              if case.removesuffix('-B1').removesuffix('-A') == 'wp_i_workspace-workflows':
                  expected_checks = re.findall(r"r\.checks\.push\('([^'\r\n]+)'\)", '\n'.join(files[suite_script]))
                  progress = folder / 'progress.json'
                  if folder.is_dir() and not folder.is_symlink() and progress.is_file() and not progress.is_symlink():
                      with progress.open('rb') as stream:
                          data = stream.read(512 * 1024 + 1)
                      if len(data) <= 512 * 1024:
                          try:
                              checks = json.loads(data).get('checks')
                              if isinstance(checks, list) and checks == expected_checks[:len(checks)]:
                                  completed_checks = f'{len(checks)}/{len(expected_checks)}'
                          except (ValueError, AttributeError):
                              pass
          browser_name = re.compile(r'(?:browser\.local|card|registry|(?:browser|drafts|zoom)-\d+)\.log')
          server_name = re.compile(r'(?:server(?:\.local)?|(?:browser|drafts|zoom)-\d+-server)\.log')
          sources = [(root / f'{case}.runner.log', 'runner')]
          if folder.is_dir() and not folder.is_symlink():
              for path in islice(folder.iterdir(), 64):
                  if browser_name.fullmatch(path.name):
                      sources.append((path, 'browser'))
                  elif server_name.fullmatch(path.name):
                      sources.append((path, 'server'))

          seen, markers, zoom_phases = set(), set(), set()
          rules = {
              'dependency': rb'ModuleNotFoundError:|ImportError:|Cannot find module|ERR_MODULE_NOT_FOUND|error while loading shared libraries',
              'server-start': rb'[Ss]ynthetic server did not (?:start|become ready)|[Tt]he synthetic server is not ready',
              'browser-launch': rb'browserType\.(?:launch|launchPersistentContext):|Executable doesn.t exist at|Host system is missing dependencies',
              'timeout': rb'TimeoutError:|TimeoutExpired:|host deadline exceeded|Timeout \d+ms exceeded',
              'assertion': rb'AssertionError|ERR_ASSERTION|expect\([^\r\n]*\)\.to',
              'server-exception': rb'Exception in ASGI application',
          }
          for path, kind in sources:
              if path.is_symlink() or not path.is_file():
                  continue
              with path.open('rb') as stream:
                  limit = 256 * 1024
                  prefix = stream.read(limit)
                  size = stream.seek(0, 2)
                  if size > limit:
                      stream.seek(max(limit, size - limit))
                      prefix += b'\n' + stream.read(limit)
              seen.add(kind)
              for marker, pattern in rules.items():
                  if re.search(pattern, prefix):
                      markers.add(f'{kind}:{marker}')
              if kind == 'browser' and timeout_target and re.search(rules['timeout'], prefix):
                  lines = prefix.splitlines()
                  for index, row in enumerate(lines):
                      operation = timeout_op.match(row)
                      if operation is None:
                          continue
                      timeout_ops.add(operation[1].decode('ascii'))
                      for frame in lines[index + 1:index + 97]:
                          if timeout_op.match(frame):
                              break
                          match = safe_frame.fullmatch(frame)
                          if not match:
                              continue
                          file = match[1].decode('ascii')
                          line, column = int(match[2]), int(match[3])
                          if 0 < line <= len(files[file]) and 0 < column <= len(files[file][line - 1]) + 1:
                              timeout_locations.add((file, line, column))
              if kind == 'browser' and case == 'quality-browser_zoom':
                  for phase in ('launch-persistent-context', 'login-and-load-quality-page',
                                *(f'theme={theme} nativeZoom={factor}'
                                  for theme in ('light', 'dark') for factor in (100, 200, 400))):
                      marker = f'Quality native zoom failed at {phase}'.encode()
                      if marker in prefix.splitlines():
                          zoom_phases.add(phase.replace(' ', '/'))

          # Only closed-set labels are emitted, never a matched log line or a path.
          print(f'I9_DIAG={case} sources={",".join(sorted(seen)) or "none"} '
                f'markers={",".join(sorted(markers)) or "unknown"} '
                f'zoom_phase={",".join(sorted(zoom_phases)) or "unknown"}')
          if timeout_target:
              locations = ','.join(f'{file}:{line}:{column}' for file, line, column in sorted(timeout_locations)[:4])
              print(f'I9_TIMEOUT={case} operations={",".join(sorted(timeout_ops)) or "unknown"} '
                    f'stack={locations or "unknown"} completed_checks={completed_checks}')
          PY
          }
          run_case() {
            local name="$1"
            shift
            if "$@" > "$root/$name.runner.log" 2>&1; then
              echo "I9_CASE=$name PASS"
            else
              local code="$?"
              echo "I9_CASE=$name FAIL $code"
              summarize_failure "$name" 2>/dev/null || echo "I9_DIAG=$name unavailable"
              result=1
            fi
          }
          suites() {
            local folder="$1" count="$2"
            shift 2
            local suite name
            for suite in "$@"; do
              name="$folder-$suite"
              run_case "$name" python "tools/tests/$folder/run.py" --suite "$suite" --count "$count" --out "$root/$name"
            done
          }
          case "$SUITE" in
            history-*)
              export HISTORY_SCENARIO="${SUITE#history-}"
              python -B "$RUNNER_TEMP/trace_unknown_denial.py"
              test "$(git diff --name-only)" = "tools/tests/wp_i_card/history.cjs"
              suites wp_i_card 100 history
              python - "$root/wp_i_card-history/card.log" <<'PYTRACE'
          from pathlib import Path
          import re
          import sys

          labels = (
              r"(?:request|failed)-(?:detail|search|registry|identity)"
              r"|response-(?:detail|search|registry|identity)-(?:[1-5][0-9]{2})"
              r"|(?:logged-in|card-open|events-open|unknown-dialog|revoked|clicked-stay|"
              r"denied-finished|registry-focused|held-arrived|registry-finished)-[01]{7}"
              r"|held-start-(?:search|registry)|held-status-[1-5][0-9]{2}|held-fulfilled"
          )
          path = Path(sys.argv[1])
          if path.is_symlink() or not path.is_file():
              raise SystemExit("history diagnostic log unavailable")
          for line in path.read_text().splitlines()[:512]:
              if re.fullmatch(r"I9_HD=[1-9][0-9]{0,3} [0-9]{1,8} (?:" + labels + r")", line):
                  print(line)
          PYTRACE
              git restore -- tools/tests/wp_i_card/history.cjs
              ;;
            wp-h)
              for suite in browser drafts zoom; do
                run_case "wp-h-$suite" python tools/tests/wp_h/run.py "$suite" --out "$root/wp-h-$suite"
              done ;;
            registry-card)
              for count in 100 1000 10000; do
                run_case "registry-$count" python tools/tests/wp_i/run.py --count "$count" --out "$root/registry-$count"
              done
              suites wp_i_card 100 card errors clinical zoom ;;
            create) suites wp_i_create 100 create errors workflows zoom ;;
            consilium-schedule) suites wp_i_consilium 1000 schedule workflows loading zoom ;;
            consilium-records) suites wp_i_consilium 1000 decisions decisionzoom records recordszoom ;;
            notifications)
              suites wp_i_notifications 100 browser workflows retry zoom
              suites wp_i_notifications 1000 fix1 fix2 ;;
            ai) suites wp_i_ai 1000 browser workflows zoom ;;
            management-audit)
              suites wp_i_management 1000 browser workflows zoom
              suites wp_i_audit_chair 1000 browser workflows zoom ;;
            workspace)
              suites wp_i_workspace 1000 browser
              probe="$RUNNER_TEMP/ws-probe"
              echo "I9_WS_CASE=B1 $CANDIDATE_SHA"
              export WS_BACKEND_TIMELINE="$root/server-timeline.jsonl" WS_BACKEND_ARM="$root/armed"
              python -B "$probe/apply_probe.py" "$probe"
              python -B "$probe/apply_precondition.py" "$probe"
              test "$(git diff --name-only)" = "$(printf '%s\n' tools/tests/wp_i_workspace/server.py tools/tests/wp_i_workspace/workflows.cjs)"
              suites wp_i_workspace 1000 workflows
              if [[ -f "$root/wp_i_workspace-workflows/results.json" ]]; then
                python -B -c 'import json,sys; n=len(json.load(open(sys.argv[1]))["checks"]); assert n==13; print("I9_WS_CHECKS=13/13")' "$root/wp_i_workspace-workflows/results.json"
              fi
              python -B "$probe/publish_receipt.py" "$root/wp_i_workspace-workflows/browser-timeline.jsonl" "$WS_BACKEND_TIMELINE"
              git restore -- tools/tests/wp_i_workspace/server.py tools/tests/wp_i_workspace/workflows.cjs
              suites wp_i_workspace 1000 zoom
              ;;
            quality-owner)
              run_case quality-browser python tools/tests/wp_i_quality/run_browser.py --suite browser --count 240 --out "$root/quality-browser" ;;
            quality-native-zoom)
              run_case quality-browser_zoom python tools/tests/wp_i_quality/run_browser.py --suite browser_zoom --count 240 --out "$root/quality-browser_zoom" ;;
            *) exit 2 ;;
          esac
          exit "$result"
