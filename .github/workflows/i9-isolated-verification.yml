name: I-9 isolated browser and performance verification
on:
  push:
    branches: [fix/i9-browser-verification]
permissions:
  contents: read
jobs:
  synthetic-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        suite: [quality-native-zoom]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 72dad18c11feb8d9d8b62b702b05f54ed7ffad1d
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install locked synthetic test dependencies
        run: |
          python -m pip install --disable-pip-version-check -r backend/requirements-dev.txt
          npm ci --ignore-scripts --prefix tools/tests/wp_h
          tools/tests/wp_h/node_modules/.bin/playwright install --with-deps chromium
      - name: Verify and run exact candidate
        env:
          SUITE: ${{ matrix.suite }}
          CANDIDATE: 72dad18c11feb8d9d8b62b702b05f54ed7ffad1d
          ORIGINAL: 05ba90df4225e3918611b78c04e14d63c57238ff
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE"
          echo "I9_ENV=$CANDIDATE $(uname -sm) $(python -V) node=$(node -v)"
          export PLAYWRIGHT_MODULE="$PWD/tools/tests/wp_h/node_modules/playwright"
          export AXE_SOURCE="$PWD/tools/tests/wp_h/node_modules/axe-core/axe.min.js"
          export WP_H_FULL_CHROMIUM="$(node -p 'require(process.env.PLAYWRIGHT_MODULE).chromium.executablePath()')"
          test -x "$WP_H_FULL_CHROMIUM"
          "$WP_H_FULL_CHROMIUM" --version
          root="$(mktemp -d /tmp/i9z.XXXXXX)"
          trap 'rm -rf -- "$root"' EXIT
          result=0
          run_case() {
            local name="$1"
            shift
            if "$@" > "$root/$name.runner.log" 2>&1; then
              echo "I9_CASE=$name PASS"
            else
              local code="$?"
              echo "I9_CASE=$name FAIL $code"
              find "$root" -maxdepth 3 -type f \( -name '*.log' -o -name '*.err' \) -path "*$name*" -exec grep -hE 'AssertionError|Timeout|Error:|Traceback|exit=|browserType[.]launch|FATAL|Permission denied|shared libraries' {} + | tail -18 || true
              result=1
            fi
          }
          legacy() (
            set -euo pipefail
            local server="$1" script="$2" variable="$3" host="$4"
            shift 4
            local port=18427 pid
            python "tools/tests/$server.py" --port "$port" "$@" > "$root/$script.server.log" 2>&1 &
            pid=$!
            trap 'kill -INT "$pid" 2>/dev/null || true; wait "$pid" 2>/dev/null || true' EXIT
            python - "$port" <<'I9_WAIT_PY' || exit 1
          import socket, sys, time
          deadline = time.monotonic() + 60
          while time.monotonic() < deadline:
              try:
                  with socket.create_connection(("127.0.0.1", int(sys.argv[1])), timeout=1):
                      break
              except OSError:
                  time.sleep(0.1)
          else:
              raise SystemExit("Synthetic service failed to listen")
          I9_WAIT_PY
            env "$variable=http://$host:$port" timeout 300 node "tools/tests/$script.cjs"
          )
          suites() {
            local folder="$1" count="$2"
            shift 2
            local s name
            for s in "$@"; do
              name="$folder-$s"
              run_case "$name" python "tools/tests/$folder/run.py" --suite "$s" --count "$count" --out "$root/$name"
            done
          }
          case "$SUITE" in
            quality-native-zoom)
              run_case quality-zoom python tools/tests/wp_i_quality/run_browser.py --suite browser_zoom --count 240 --out "$root/qz"
              if [ "$result" -eq 0 ]; then
                python -c 'import json,sys; print("I9_ZOOM=" + json.dumps(json.load(open(sys.argv[1])), separators=(",",":")))' "$root/qz/browser-native-zoom.json"
              else
                grep -E 'browserType[.]launch|FATAL|AssertionError|shared libraries|Permission denied|Timeout' "$root/qz/browser.local.log" | tail -15 || true
              fi ;;
            wp-d)
              run_case wp_d_browser timeout 300 node tools/tests/wp_d_browser.cjs
              for s in wp_d_live_browser wp_d_fix1_browser wp_d_fix2_browser; do
                run_case "$s" legacy wp_d_synthetic_server "$s" WP_D_SYNTHETIC_ORIGIN 127.0.0.1
              done ;;
            wp-e-f-g)
              run_case wp_e_browser legacy wp_e_synthetic_server wp_e_browser WP_E_SYNTHETIC_ORIGIN 127.0.0.1 --now 2026-10-01T11:00:00+03:00
              run_case wp_f_fix2_browser legacy wp_d_synthetic_server wp_f_fix2_browser WP_D_SYNTHETIC_ORIGIN 127.0.0.1
              run_case wp_g_idle_browser legacy wp_g_synthetic_server wp_g_idle_browser WP_D_SYNTHETIC_ORIGIN 127.0.0.1
              run_case wp_g_mfa_browser legacy wp_g_mfa_synthetic_server wp_g_mfa_browser SYNTHETIC_MFA_ORIGIN localhost
              run_case wp_g_stage2c_browser legacy wp_g_stage2c_synthetic_server wp_g_stage2c_browser STAGE2C_SYNTHETIC_ORIGIN localhost ;;
            wp-h)
              for s in browser drafts zoom; do
                run_case "wp-h-$s" python tools/tests/wp_h/run.py "$s" --out "$root/wp-h-$s"
              done ;;
            registry-card)
              for count in 100 1000 10000; do
                run_case "registry-$count" python tools/tests/wp_i/run.py --count "$count" --out "$root/registry-$count"
              done
              suites wp_i_card 100 card errors clinical zoom ;;
            create)
              suites wp_i_create 100 create errors workflows zoom ;;
            consilium-schedule)
              suites wp_i_consilium 1000 schedule workflows loading zoom ;;
            consilium-records)
              suites wp_i_consilium 1000 decisions decisionzoom records recordszoom ;;
            notifications)
              suites wp_i_notifications 100 browser workflows retry zoom
              suites wp_i_notifications 1000 fix1 fix2 ;;
            ai)
              suites wp_i_ai 1000 browser workflows zoom ;;
            management-audit)
              suites wp_i_management 1000 browser workflows zoom
              suites wp_i_audit_chair 1000 browser workflows zoom ;;
            workspace-quality)
              suites wp_i_workspace 1000 browser workflows zoom
              for s in browser browser_zoom; do
                run_case "quality-$s" python tools/tests/wp_i_quality/run_browser.py --suite "$s" --count 240 --out "$root/quality-$s"
              done ;;
            performance)
              git worktree add --detach "$RUNNER_TEMP/i9-original" "$ORIGINAL"
              test "$(git -C "$RUNNER_TEMP/i9-original" rev-parse HEAD)" = "$ORIGINAL"
              # Exactly the same fixture and metrics runner for both app versions.
              cp tools/tests/wp_h/{run.py,server.py,benchmark.cjs} "$RUNNER_TEMP/i9-original/tools/tests/wp_h/"
              export TZ=UTC
              benchmark_version() (
                local path="$1" label="$2" sha="$3"
                cd "$path" || exit 1
                test "$(git rev-parse HEAD)" = "$sha" || exit 1
                python tools/tests/wp_h/run.py benchmark --out "$root/$label"
              )
              for sample in 1 2 3; do
                run_case "perf-baseline-$sample" benchmark_version "$RUNNER_TEMP/i9-original" "perf-baseline-$sample" "$ORIGINAL"
                run_case "perf-candidate-$sample" benchmark_version "$GITHUB_WORKSPACE" "perf-candidate-$sample" "$CANDIDATE"
              done
              if [ "$result" -eq 0 ]; then
                python - "$root" "$ORIGINAL" "$CANDIDATE" <<'I9_PERF_PY'
          import json, statistics, sys
          from pathlib import Path
          root = Path(sys.argv[1])
          for label, sha in zip(("baseline", "candidate"), sys.argv[2:]):
              for population in (100, 1000, 10000):
                  rows = [json.loads((root / f"perf-{label}-{i}" / f"after-{population}.json").read_text()) for i in (1, 2, 3)]
                  for role in ("dev", "doc0", "head"):
                      samples = [next(x for x in row["roles"] if x["role"] == role) for row in rows]
                      metrics = {
                          "apiMs": [1000 * x["api"]["seconds"] for x in samples],
                          "sql": [x["api"]["sql"] for x in samples],
                          "bytes": [x["api"]["bytes"] for x in samples],
                          "validationMs": [1000 * x["api"]["validation_seconds"] for x in samples],
                          "auditWriteMs": [1000 * x["api"]["audit_write_seconds"] for x in samples],
                          "renderMs": [x["rendering"]["throughPaintMs"] for x in samples],
                          "dom": [x["rendering"]["dom"] for x in samples],
                          "refresh409Ms": [x["refresh409"]["wallMs"] for x in samples],
                      }
                      summary = {key: [statistics.median(seq), min(seq), max(seq)] for key, seq in metrics.items()}
                      print("I9_PERF=" + json.dumps({"sha": sha, "role": role, "syntheticPopulation": population, "medianMinMax": summary}, separators=(",", ":")))
          I9_PERF_PY
              fi ;;
          esac
          exit "$result"
