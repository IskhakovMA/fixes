name: I-8A4 synthetic browser verification
on:
  push:
    branches: [verify/i8a4-quality-owner-404]
permissions:
  contents: read
jobs:
  quality-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - run: native-zoom
            suite: browser_zoom
            count: 240
            result: browser-native-zoom.json
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: a9a23ba1f556f7f4ced4953a2ca8997230811d87
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install isolated test dependencies
        run: |
          python -m pip install --disable-pip-version-check -r backend/requirements-dev.txt
          npm install --prefix "$RUNNER_TEMP/quality-deps" playwright@1.62.1 axe-core@4.11.0
          "$RUNNER_TEMP/quality-deps/node_modules/.bin/playwright" install --with-deps chromium
      - name: Run against disposable loopback fixture
        env:
          SUITE: ${{ matrix.suite }}
          COUNT: ${{ matrix.count }}
          RESULT: ${{ matrix.result }}
        run: |
          test "$(git rev-parse HEAD)" = a9a23ba1f556f7f4ced4953a2ca8997230811d87
          export PLAYWRIGHT_MODULE="$RUNNER_TEMP/quality-deps/node_modules/playwright"
          export AXE_SOURCE="$RUNNER_TEMP/quality-deps/node_modules/axe-core/axe.min.js"
          output="$RUNNER_TEMP/quality-results"
          if ! python tools/tests/wp_i_quality/run_browser.py --out "$output" --suite "$SUITE" --count "$COUNT"; then
            if [ -f "$output/browser.local.log" ]; then
              grep -E '^(AssertionError|.*: Timeout|browserType[.]launch|.*error while loading shared libraries|.*FATAL|.*Host system is missing|.*Permission denied|    at .*wp_i_quality/)' "$output/browser.local.log" | tail -12 || true
            fi
            exit 1
          fi
          test -s "$output/$RESULT"
          python -c 'import json,sys; print("I8A4_EVIDENCE=" + json.dumps(json.load(open(sys.argv[1])), separators=(",",":")))' "$output/$RESULT"
